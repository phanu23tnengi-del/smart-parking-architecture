<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smart Parking — Full Project Architecture</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --border: #334155;
    --text: #f8fafc;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    background: rgba(15, 23, 42, 0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 10px;
  }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 3px 0 0; font-size: 13px; color: var(--muted); }
  .controls { display: flex; gap: 10px; }
  .btn {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn:hover { background: #334155; }
  .btn.active { background: #0284c7; border-color: #38bdf8; }

  main {
    max-width: 1500px;
    margin: 0 auto;
    padding: 20px 24px 36px;
  }
  .canvas-wrap {
    width: 100%;
    overflow-x: auto;
    background: #0b1120;
    border-radius: 16px;
    border: 1px solid var(--border);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    padding: 12px;
  }
  svg {
    display: block;
    margin: 0 auto;
    max-width: 100%;
    height: auto;
  }

  /* Hover Focus Transitions */
  .node-group, .edge-group { transition: opacity 0.2s ease; }
  .node-group { cursor: pointer; }
  .node-rect { transition: stroke-width 0.15s, filter 0.15s; }
  .node-group:hover .node-rect { filter: brightness(1.18); stroke-width: 2.5px; }
  .node-group.selected .node-rect { stroke: #c6f25f !important; stroke-width: 3px; }

  svg.has-focus .node-group:not(.focused) { opacity: 0.22; }
  svg.has-focus .edge-group:not(.focused) { opacity: 0.08; }
  svg.has-focus .edge-group.focused .edge-path { stroke: #38bdf8; stroke-width: 2.8px; }
  svg.has-focus .edge-group.focused .edge-label-bg { stroke: #38bdf8; fill: #0f172a; }
  svg.has-focus .edge-group.focused .edge-label-text { fill: #f8fafc; font-weight: 600; }

  svg.hide-labels .edge-label-group { opacity: 0; pointer-events: none; }
  svg.hide-labels.has-focus .edge-group.focused .edge-label-group { opacity: 1; }

  /* Summary Cards Grid */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
    gap: 16px;
    margin-top: 20px;
  }
  .info-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
  }
  .info-card:hover {
    border-color: #38bdf8;
    transform: translateY(-2px);
  }
  .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .card-head h3 { margin: 0; font-size: 15px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .info-card ul { margin: 0; padding-left: 18px; color: #cbd5e1; font-size: 13.5px; line-height: 1.55; }
  .card-link { margin-top: 10px; font-size: 12.5px; color: #38bdf8; font-weight: 600; }

  /* Drawer */
  #backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 30;
  }
  #drawer {
    position: fixed;
    top: 0;
    right: -420px;
    width: 400px;
    max-width: 92vw;
    height: 100vh;
    background: var(--panel);
    border-left: 1px solid var(--border);
    padding: 24px;
    z-index: 40;
    transition: right 0.25s ease;
    overflow-y: auto;
    box-shadow: -10px 0 30px rgba(0,0,0,0.5);
  }
  #drawer.open { right: 0; }
  #drawer-close {
    float: right;
    background: #334155;
    border: none;
    color: var(--text);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 14px;
    cursor: pointer;
  }
  #drawer h2 { margin: 0 0 6px; font-size: 19px; color: #c6f25f; }
  #drawer .sub { color: #cbd5e1; font-size: 13.5px; margin-bottom: 16px; line-height: 1.5; }
  .sec-label { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin: 16px 0 6px; }
  #drawer .tag {
    display: inline-block;
    background: #0f172a;
    border: 1px solid var(--border);
    padding: 3px 9px;
    border-radius: 6px;
    font-family: monospace;
    font-size: 12.5px;
    margin: 0 6px 6px 0;
    color: #38bdf8;
  }
  #drawer ul { padding-left: 18px; line-height: 1.65; color: #e2e8f0; font-size: 14px; }
</style>
</head>

.ts", "YOLO ตรวจจับมอเตอร์ไซค์บน CUDA (สลับไป CPU อัตโนมัติถ้า GPU Error) และเช็กจุดล้อใน ROI"]}, {"dot": "#fb7185", "title": "2. Timer & Async Alert", "targetNode": "monitor", "items": ["parking_monitor.py นับเวลาจอดแช่ (ค่าเริ่มต้น 60 วินาที, ลืมรถเมื่อออกเกิน 3 วินาที)", "ส่งงานเซฟรูป อัปโหลด imgbb และยิง LINE ผ่าน ThreadPoolExecutor (2 workers) พร้อมระบบ Retry"]}, {"dot": "#34d399", "title": "3. Dashboard & Live Stream", "targetNode": "dashboard", "items": ["main.py เปิด Flask พอร์ต 5000 ส่งภาพ MJPEG และ API ให้ dashboard.py ดึงไปแสดงผล", "รองรับการวาดพิกัด ROI ผ่าน HTML5 Canvas และระบบล็อกอินแยกสิทธิ์ Admin / Viewer"]}, {"dot": "#f59e0b", "title": "4. Database & Auto Cleanup", "targetNode": "logdb", "items": ["บันทึกประวัติลง SQLite (parking_log.db โหมด WAL) คู่กับไฟล์ภาพใน DATA_Imgbb/", "ระบบล้างประวัติและไฟล์ภาพหลักฐานที่เก่าเกิน 24 ชั่วโมงออกโดยอัตโนมัติ"]}]};
const svg = document.getElementById("diagram");
const NS = "http://www.w3.org/2000/svg";

document.getElementById("hdr-title").textContent = DATA.title;
document.getElementById("hdr-sub").textContent = DATA.subtitle || "";

const W = DATA.canvas.width;
const H = DATA.canvas.height;
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("width", W);
svg.setAttribute("height", H);

function el(tag, attrs = {}, parent = null) {
  const node = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (parent) parent.appendChild(node);
  return node;
}

const defs = el("defs", {}, svg);
const marker = el("marker", {
  id: "arrow", viewBox: "0 0 10 10", refX: "8", refY: "5",
  markerWidth: "6", markerHeight: "6", orient: "auto-start-reverse"
}, defs);
el("path", { d: "M 0 1.5 L 10 5 L 0 8.5 z", fill: "#64748b" }, marker);

const markerFocus = el("marker", {
  id: "arrow-focus", viewBox: "0 0 10 10", refX: "8", refY: "5",
  markerWidth: "6", markerHeight: "6", orient: "auto-start-reverse"
}, defs);
el("path", { d: "M 0 1.5 L 10 5 L 0 8.5 z", fill: "#38bdf8" }, markerFocus);

// 1. Groups
const gGroups = el("g", {}, svg);
(DATA.groups || []).forEach(g => {
  el("rect", {
    x: g.x, y: g.y, width: g.w, height: g.h, rx: 14,
    fill: g.color, "fill-opacity": "0.05",
    stroke: g.color, "stroke-opacity": "0.35", "stroke-dasharray": "6 4", "stroke-width": 1.5
  }, gGroups);
  const t = el("text", {
    x: g.x + 14, y: g.y + 22, fill: g.color, "font-size": 12, "font-weight": "700", opacity: 0.9
  }, gGroups);
  t.textContent = g.label;
});

const nodeMap = Object.fromEntries(DATA.nodes.map(n => [n.id, n]));

function getAnchor(node, side) {
  if (side === "left") return { x: node.x, y: node.y + node.h / 2, dx: -1, dy: 0 };
  if (side === "right") return { x: node.x + node.w, y: node.y + node.h / 2, dx: 1, dy: 0 };
  if (side === "top") return { x: node.x + node.w / 2, y: node.y, dx: 0, dy: -1 };
  return { x: node.x + node.w / 2, y: node.y + node.h, dx: 0, dy: 1 };
}

// 2. Edges
const gEdges = el("g", {}, svg);
const edgeElements = [];

(DATA.edges || []).forEach(e => {
  const n1 = nodeMap[e.from];
  const n2 = nodeMap[e.to];
  if (!n1 || !n2) return;

  const p1 = getAnchor(n1, e.fromSide || "right");
  const p2 = getAnchor(n2, e.toSide || "left");

  const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
  const curve = Math.min(110, Math.max(40, dist * 0.35));

  const c1x = p1.x + p1.dx * curve;
  const c1y = p1.y + p1.dy * curve;
  const c2x = p2.x + p2.dx * curve;
  const c2y = p2.y + p2.dy * curve;

  const eg = el("g", { class: "edge-group", "data-from": e.from, "data-to": e.to }, gEdges);
  const path = el("path", {
    class: "edge-path",
    d: `M ${p1.x} ${p1.y} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${p2.x} ${p2.y}`,
    fill: "none", stroke: "#475569", "stroke-width": 1.8, "marker-end": "url(#arrow)"
  }, eg);

  if (e.label) {
    const mx = 0.125*p1.x + 0.375*c1x + 0.375*c2x + 0.125*p2.x;
    const my = 0.125*p1.y + 0.375*c1y + 0.375*c2y + 0.125*p2.y;
    const lg = el("g", { class: "edge-label-group" }, eg);
    const padX = 8, textW = e.label.length * 6.5 + padX * 2;
    el("rect", {
      class: "edge-label-bg",
      x: mx - textW / 2, y: my - 10, width: textW, height: 20, rx: 10,
      fill: "#0f172a", stroke: "#334155", "stroke-width": 1
    }, lg);
    const lbl = el("text", {
      class: "edge-label-text",
      x: mx, y: my + 4, "text-anchor": "middle", fill: "#94a3b8", "font-size": 11
    }, lg);
    lbl.textContent = e.label;
  }
  edgeElements.push({ el: eg, path, from: e.from, to: e.to });
});

// 3. Nodes
const gNodes = el("g", {}, svg);
const nodeElements = {};

DATA.nodes.forEach(n => {
  const ng = el("g", { class: "node-group", "data-id": n.id }, gNodes);
  el("rect", {
    class: "node-rect",
    x: n.x, y: n.y, width: n.w, height: n.h, rx: 10,
    fill: "#1e293b", stroke: n.color || "#64748b", "stroke-width": 1.8
  }, ng);

  el("rect", {
    x: n.x, y: n.y + 10, width: 4, height: n.h - 20, rx: 2,
    fill: n.color || "#38bdf8"
  }, ng);

  const t1 = el("text", {
    x: n.x + 16, y: n.y + 32, fill: "#f8fafc", "font-size": 14, "font-weight": "700"
  }, ng);
  t1.textContent = n.title;

  if (n.subtitle) {
    const t2 = el("text", {
      x: n.x + 16, y: n.y + 52, fill: "#94a3b8", "font-size": 11.5
    }, ng);
    t2.textContent = n.subtitle;
  }

  ng.addEventListener("mouseenter", () => setFocus(n.id));
  ng.addEventListener("mouseleave", () => clearFocus());
  ng.addEventListener("click", () => openDrawer(n));
  nodeElements[n.id] = ng;
});

function setFocus(id) {
  svg.classList.add("has-focus");
  const connected = new Set([id]);
  edgeElements.forEach(item => {
    if (item.from === id || item.to === id) {
      item.el.classList.add("focused");
      item.path.setAttribute("marker-end", "url(#arrow-focus)");
      connected.add(item.from);
      connected.add(item.to);
    } else {
      item.el.classList.remove("focused");
    }
  });
  Object.entries(nodeElements).forEach(([nid, nel]) => {
    nel.classList.toggle("focused", connected.has(nid));
  });
}

function clearFocus() {
  svg.classList.remove("has-focus");
  edgeElements.forEach(item => {
    item.el.classList.remove("focused");
    item.path.setAttribute("marker-end", "url(#arrow)");
  });
  Object.values(nodeElements).forEach(nel => nel.classList.remove("focused"));
}

// 4. Summary Cards
const cardsGrid = document.getElementById("cards-grid");
(DATA.cards || []).forEach(c => {
  const card = document.createElement("div");
  card.className = "info-card";
  const head = document.createElement("div");
  head.className = "card-head";
  const dot = document.createElement("span");
  dot.className = "dot";
  dot.style.background = c.dot || "#38bdf8";
  const h3 = document.createElement("h3");
  h3.textContent = c.title;
  head.append(dot, h3);

  const ul = document.createElement("ul");
  (c.items || []).forEach(txt => {
    const li = document.createElement("li");
    li.textContent = txt;
    ul.appendChild(li);
  });

  card.append(head, ul);
  if (c.targetNode && nodeMap[c.targetNode]) {
    const link = document.createElement("div");
    link.className = "card-link";
    link.textContent = "คลิกเพื่อดูส่วนทำงานที่เกี่ยวข้อง →";
    card.appendChild(link);
    card.addEventListener("click", () => openDrawer(nodeMap[c.targetNode]));
  }
  cardsGrid.appendChild(card);
});

// Toggle Labels button
const btnLabels = document.getElementById("btn-toggle-labels");
btnLabels.addEventListener("click", () => {
  const hidden = svg.classList.toggle("hide-labels");
  btnLabels.classList.toggle("active", hidden);
  btnLabels.textContent = hidden ? "แสดงป้ายชื่อบนเส้นทั้งหมด" : "ซ่อนป้ายชื่อบนเส้น";
});

// Drawer
const drawer = document.getElementById("drawer");
const backdrop = document.getElementById("backdrop");
function closeDrawer() {
  drawer.classList.remove("open");
  backdrop.style.display = "none";
  Object.values(nodeElements).forEach(nel => nel.classList.remove("selected"));
}
document.getElementById("drawer-close").onclick = closeDrawer;
backdrop.onclick = closeDrawer;
window.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

function openDrawer(n) {
  Object.values(nodeElements).forEach(nel => nel.classList.remove("selected"));
  if (nodeElements[n.id]) nodeElements[n.id].classList.add("selected");

  document.getElementById("d-title").textContent = n.title;
  document.getElementById("d-sub").textContent = n.details?.role || n.subtitle || "";
  const filesDiv = document.getElementById("d-files");
  filesDiv.innerHTML = "";
  (n.details?.files || []).forEach(f => {
    const s = document.createElement("span");
    s.className = "tag";
    s.textContent = f;
    filesDiv.appendChild(s);
  });
  const ul = document.getElementById("d-bullets");
  ul.innerHTML = "";
  (n.details?.bullets || []).forEach(b => {
    const li = document.createElement("li");
    li.textContent = b;
    ul.appendChild(li);
  });
  backdrop.style.display = "block";
  drawer.classList.add("open");
}
</script>
